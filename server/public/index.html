<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Photo MM">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Photo MM</title>
<style>
  :root { color-scheme: dark; --bg:#111; --panel:#1c1c1e; --fg:#f2f2f7; --accent:#0a84ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px system-ui,-apple-system,sans-serif; overscroll-behavior:none; }
  body { display:flex; flex-direction:column; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header, .tools { display:flex; gap:8px; padding:8px 12px; background:var(--panel); align-items:center; flex-wrap:wrap; }
  header { justify-content:space-between; }
  main { flex:1; min-height:0; position:relative; display:flex; align-items:center; justify-content:center; }
  canvas { max-width:100%; max-height:100%; touch-action:none; }
  #empty { position:absolute; text-align:center; color:#8e8e93; line-height:1.7; padding:24px; }
  button, label.btn { background:#2c2c2e; color:var(--fg); border:0; border-radius:10px; padding:9px 13px; font:inherit; cursor:pointer; }
  button.on { background:var(--accent); }
  button:disabled { opacity:.4; }
  input[type=color] { width:38px; height:34px; border:0; padding:0; background:none; }
  input[type=range] { width:90px; }
  dialog { background:var(--panel); color:var(--fg); border:0; border-radius:14px; padding:18px; width:min(92vw,360px); }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog input, dialog textarea { width:100%; font:inherit; font-size:18px; padding:10px; border-radius:10px; border:1px solid #444; background:#000; color:var(--fg); margin:10px 0; }
  .tools[hidden], [hidden] { display:none !important; }
  .row { display:flex; gap:8px; justify-content:flex-end; }
  #toast { position:fixed; left:50%; top:60px; transform:translateX(-50%); background:#000c; padding:8px 14px; border-radius:20px; display:none; z-index:9; }
</style>
</head>
<body>
<header>
  <strong>Photo MM</strong>
  <div style="display:flex;gap:8px">
    <label class="btn">사진<input id="file" type="file" accept="image/*" hidden></label>
    <button id="urlBtn">링크 캡처</button>
    <button id="exportBtn" disabled>저장·공유</button>
  </div>
</header>
<main>
  <div id="empty">사진·스크린샷을 불러오거나<br>링크를 입력해 사이트 전체를 캡처하세요</div>
  <canvas id="cv" hidden></canvas>
</main>
<div class="tools">
  <button data-mode="select" class="on">선택</button>
  <button data-mode="dim">치수선</button>
  <button data-mode="arrow">화살표</button>
  <button data-mode="note">메모</button>
  <button data-mode="crop">자르기</button>
  <button id="resize" disabled>크기</button>
  <button id="undo" disabled>실행취소</button>
  <button id="edit" disabled>수정</button>
  <button id="del" disabled>삭제</button>
  <input id="color" type="color" value="#ff3b30" aria-label="색상">
  <input id="size" type="range" min="10" max="80" value="30" aria-label="글자 크기">
</div>
<div id="cropbar" class="tools" hidden>
  <span id="cropInfo" style="flex:1"></span>
  <button id="cropCancel">취소</button>
  <button id="cropOk" class="on">자르기 적용</button>
</div>
<div id="toast"></div>

<dialog id="dlgNum"><form method="dialog">
  <div>줄자로 잰 길이 (mm)</div>
  <input id="numIn" inputmode="decimal" placeholder="예: 1250" autocomplete="off">
  <div class="row"><button value="cancel">취소</button><button value="ok" class="on">확인</button></div>
</form></dialog>
<dialog id="dlgNote"><form method="dialog">
  <div>메모</div>
  <textarea id="noteIn" rows="3"></textarea>
  <div class="row"><button value="cancel">취소</button><button value="ok" class="on">확인</button></div>
</form></dialog>
<dialog id="dlgResize"><form method="dialog">
  <div id="resizeInfo"></div>
  <div style="display:flex;gap:8px;margin:10px 0;align-items:center">
    <input id="rzW" inputmode="numeric" style="margin:0" aria-label="가로 px"> ×
    <input id="rzH" inputmode="numeric" style="margin:0" aria-label="세로 px">
  </div>
  <div class="row" style="justify-content:flex-start;flex-wrap:wrap;margin-bottom:10px">
    <button type="button" data-pct="25">25%</button><button type="button" data-pct="50">50%</button><button type="button" data-pct="75">75%</button><button type="button" data-pct="100">원본</button>
  </div>
  <div class="row"><button value="cancel">취소</button><button value="ok" class="on">적용</button></div>
</form></dialog>
<dialog id="dlgUrl"><form method="dialog">
  <div>캡처할 사이트 주소</div>
  <input id="urlIn" type="url" placeholder="https://" autocomplete="off">
  <div class="row"><button value="cancel">취소</button><button value="ok" class="on">캡처</button></div>
</form></dialog>
<script type="module" src="/app.js"></script>
</body>
</html>
